<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="icon" href="data:," />
  <title>Block Physics Demo</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #e9eaec; font: 13px/1.4 system-ui, sans-serif; color: #333; }
    canvas { touch-action: none; display: block; width: 100vw; height: 100vh; cursor: default; }
    .panel { position: fixed; background: rgba(255,255,255,.85); border: 1px solid #ccd; border-radius: 6px; padding: 8px 10px; }
    #hud { top: 8px; left: 8px; display: grid; gap: 6px; min-width: 190px; }
    #hud .row { display: flex; gap: 6px; align-items: center; }
    #hud select, #hud button { font: inherit; padding: 2px 6px; }
    #hud .stat { display: flex; justify-content: space-between; }
    #msg { font-weight: 600; color: #1d7a3a; min-height: 1.4em; }
    #dl { position: fixed; bottom: 8px; right: 8px; font-size: 11px; opacity: .45; }
    #dl button { font: inherit; padding: 1px 6px; background: none; border: 1px solid #aab; border-radius: 4px; color: #445; cursor: pointer; }
    #dl button:hover { opacity: 1; }
    #dev { bottom: 8px; left: 8px; font-size: 12px; opacity: .8; }
    #dev summary { cursor: pointer; }
    #dev label { display: block; margin-top: 4px; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="hud" class="panel">
    <div class="row"><select id="tower"></select></div>
    <div class="row" id="variantRow" style="display:none"><select id="variant"></select></div>
    <div class="row"><button id="reset">Reset tower</button><button id="pause">Pause</button></div>
    <label style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="demo" /> Demo Mode</label>
    <div class="stat"><span>Blocks remaining</span><b id="remaining">-</b></div>
    <div class="stat"><span>Actions</span><b id="actions">0</b></div>
    <div class="stat"><span>Status</span><span id="status">-</span></div>
    <div id="msg"></div>
  </div>
  <div id="dl"><button id="dlJson" title="Download the data collected in this browser session">Download data</button> <button id="dlCsv">CSV</button></div>
  <details id="dev" class="panel">
    <summary>Developer</summary>
    <label>Scene set: <select id="mode"><option value="towers">Towers</option><option value="playground">Material playground</option></select></label>
    <div id="devinfo" style="margin:4px 0;max-width:230px;opacity:.8"></div>
    <label>Impulse magnitude: <b id="forceVal"></b><br /><input id="force" type="range" min="0.5" max="8" step="0.1" /></label>
    <label style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="anytime" /> Click while blocks are moving</label>
    <label>Hold time (ms; 0 = click): <b id="holdVal"></b><br /><input id="hold" type="range" min="0" max="1000" step="50" /></label>
    <label>Gray density / blue: <b id="grayVal"></b><br /><input id="gray" type="range" min="1" max="20" step="0.5" /></label>
    <label>Pink stiffness E: <b id="eVal"></b><br /><input id="stiff" type="range" min="40" max="800" step="10" /></label>
    <div style="opacity:.7">(density/stiffness changes reset the tower)</div>
  </details>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
